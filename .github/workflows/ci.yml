name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Run tests
        run: pytest -q
      - name: Build container
        run: docker build -t etl-observability-dashboard:ci .
      - name: Start container
        run: docker run -d --name etl-observability -p 8000:8000 etl-observability-dashboard:ci
      - name: Smoke test running service
        run: |
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ready; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -X POST 'http://127.0.0.1:8000/api/simulate?count=6&seed=7'
          curl -fsS http://127.0.0.1:8000/api/summary
          curl -fsS http://127.0.0.1:8000/metrics
      - name: Container logs on failure
        if: failure()
        run: docker logs etl-observability || true
