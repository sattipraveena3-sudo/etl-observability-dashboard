<!doctype html><html><head><meta charset="utf-8"><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script><style>body{font:15px system-ui;background:#07130f;color:#e8fff5;max-width:1100px;margin:auto;padding:30px}button{padding:12px 20px;background:#6ee7b7;border:0;border-radius:30px}.card{background:#10231d;padding:20px;border-radius:15px;margin:15px 0}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #285043;text-align:left}</style></head><body><h1>ETL Pipeline Observability</h1><button id="run">Generate demo runs</button><div class="card" id="chart"></div><div class="card"><h2>Alerts</h2><table id="alerts"></table></div><script>async function load(){const runs=await(await fetch('/runs')).json();Plotly.newPlot('chart',[{x:runs.map(x=>new Date(x.created*1000)),y:runs.map(x=>x.duration),mode:'lines+markers',name:'duration'}],{paper_bgcolor:'transparent',plot_bgcolor:'transparent',font:{color:'#cff5e5'}});const a=await(await fetch('/alerts')).json();alerts.innerHTML='<tr><th>Job</th><th>Level</th><th>Message</th></tr>'+a.map(x=>`<tr><td>${x.job}</td><td>${x.level}</td><td>${x.message}</td></tr>`).join('')}run.onclick=async()=>{await fetch('/simulate',{method:'POST'});load()};load()</script></body></html>
